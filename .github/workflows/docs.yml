name: Docs

# Builds the Astro/Starlight site in docs/ on every change that can alter it,
# and publishes it to GitHub Pages (warlock.js.org) from main.
#
# In the monorepo the build sees every package, so the changelog page is
# regenerated from packages/*/CHANGELOG.md on each build instead of relying on
# a copy committed from a developer machine.
#
# Deployment runs only when the repository variable DEPLOY_DOCS is "true", so
# a fork, or this repository before Pages is enabled, builds without failing.

on:
  pull_request:
    paths:
      - "docs/**"
      - "packages/*/CHANGELOG.md"
      - "packages/*/llms*.txt"
      - "packages/*/package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "packages/*/CHANGELOG.md"
      - "packages/*/llms*.txt"
      - "packages/*/package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.24.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile --filter @warlock.js/docs...

      - name: Changelog generator tests
        working-directory: docs
        run: |
          pnpm run test:changelog
          pnpm run test:changelog-freshness
          pnpm run test:gfm-check

      - name: Build site
        working-directory: docs
        run: pnpm run build

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/dist

  deploy:
    name: Deploy
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_DOCS == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
