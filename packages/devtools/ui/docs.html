<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>API reference</title>
  </head>
  <body>
    <!-- Scalar reads its settings from this element. Every URL is relative to /docs, so the page works under any dashboard base path. Fonts, telemetry, the AI agent and MCP are off: this is a loopback dev tool and must not call out. -->
    <script
      id="api-reference"
      data-url="api/openapi.json"
      data-configuration='{"withDefaultFonts":false,"telemetry":false,"showDeveloperTools":"never","agent":{"disabled":true},"mcp":{"disabled":true}}'
    ></script>
    <script src="assets/scalar.js"></script>
  </body>
</html>
