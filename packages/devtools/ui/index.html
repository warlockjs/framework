<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Warlock Devtools</title>
    <link rel="stylesheet" href="assets/app.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>Warlock Devtools</h1>
      <nav aria-label="Dashboard sections">
        <button class="tab is-active" data-tab="requests">Requests</button>
        <button class="tab" data-tab="queries">Queries</button>
        <button class="tab" data-tab="mail">Mail</button>
        <button class="tab" data-tab="logs">Logs</button>
        <button class="tab" data-tab="routes">Routes</button>
        <button class="tab" data-tab="api">API</button>
      </nav>
      <button id="clear" class="clear" type="button">Clear</button>
    </header>
    <main id="app" aria-live="polite"></main>
    <script type="module" src="assets/app.js"></script>
  </body>
</html>
