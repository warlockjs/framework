# Explicit list, not a glob: docs/scripts read this manifest line by line
# (generate-changelog.mjs, generate-site-llms.mjs) and do not expand globs.
# tools/release is deliberately absent: it is npm-managed (package-lock.json).
packages:
  - packages/access
  - packages/ai
  - packages/ai-anthropic
  - packages/ai-bedrock
  - packages/ai-cli
  - packages/ai-deepseek
  - packages/ai-google
  - packages/ai-groq
  - packages/ai-live
  - packages/ai-mistral
  - packages/ai-ollama
  - packages/ai-openai
  - packages/ai-panoptic
  - packages/ai-tools
  - packages/ai-workspace
  - packages/ai-xai
  - packages/auth
  - packages/cache
  - packages/cascade
  - packages/context
  - packages/core
  - packages/create-warlock
  - packages/devtools
  - packages/fs
  - packages/herald
  - packages/logger
  - packages/notifications
  - packages/queue
  - packages/scheduler
  - packages/seal
  - packages/sitemap
  - packages/web
  - docs

# Dependency install-scripts are BLOCKED by default — pnpm's supply-chain protection.
# yarn 1 ran every one of them unconditionally, so this is a security improvement we are
# keeping. The allowlist stays minimal and evidence-driven, never a blanket approval:
# a package earns `true` only if its install script is genuinely REQUIRED and it is a
# DIRECT dependency of one of our own packages. Everything else is an explicit `false`
# so the decision is recorded rather than merely absent.
allowBuilds:
  # native binary, direct dependency of core — does not function without its install script
  esbuild: true
  # native binary, direct dependency of core and docs — same
  sharp: true
  # direct dependency of ai-google, but nothing has shown its script is needed
  "@google/genai": false
  # transitive only (via testcontainers / ssh2); not required
  protobufjs: false
  cpu-features: false
  ssh2: false
  # transitive via bullmq (optional native msgpack speed-up; msgpackr falls back to pure JS)
  msgpackr-extract: false

# The family publishes all 28 packages at one version, so EVERY release is
# younger than pnpm's default release-age gate. Excluding by version pins a line
# per package per release and goes stale the moment we publish again; the scope
# pattern never needs editing. Matches create-warlock's workspace file.
minimumReleaseAgeExclude:
  - "@warlock.js/*"
  - "@mongez/localization@3.5.0"
  - "@mongez/collection@1.4.1"
  - "@mongez/concat-route@1.2.1"
  - "@mongez/config@1.2.2"
  - "@mongez/copper@2.1.3"
  - "@mongez/dotenv@1.3.3"
  - "@mongez/encryption@2.0.2"
  - "@mongez/events@2.2.8"
  - "@mongez/vite@2.2.1"
  - "@bull-board/api@9.10.2"
  - "@bull-board/fastify@9.10.2"
  - "@bull-board/ui@9.10.2"
  - "@mongez/supportive-is@3.0.0"

# Hoisted into the ROOT node_modules for TOOLING VISIBILITY only.
#
# agent-kit's `sync` discovers skills by scanning the root node_modules for packages
# that ship a skills/ directory. Under yarn's hoisted tree every transitive @mongez and
# every workspace @warlock.js package was visible there. pnpm strict exposes only what
# the ROOT itself declares - 7 of 23 @mongez packages, and none of the workspace ones -
# so a sync rebuilt the skills catalogue from a fraction of its sources and deleted the
# rest. @types/* is here for tsc for the same reason.
#
# This changes only what is VISIBLE at the root. It does not change what any package can
# RESOLVE, so the strict-linking property this migration exists to get is untouched:
# every package still has to declare what it imports.
publicHoistPattern:
  - "@types/*"
  - "@mongez/*"
  - "@warlock.js/*"

# Resolve @warlock.js/* specs against the packages in this repository, never the
# registry: a release candidate is unpublished while it is gated.
linkWorkspacePackages: true

# Compatibility exception: these tools require the classic JS API removed in TS7.
# Verified by the ESLint scaffold specs (ts-api-utils: TypeFlags.Intrinsic).
# Give them their own runtime compiler; workspace and app tsc stay on 7.0.2.
packageExtensions:
  "@typescript-eslint/parser":
    dependencies:
      typescript: "5.9.3"
  "@typescript-eslint/eslint-plugin":
    dependencies:
      typescript: "5.9.3"
  "@typescript-eslint/type-utils":
    dependencies:
      typescript: "5.9.3"
  "@typescript-eslint/utils":
    dependencies:
      typescript: "5.9.3"
  "@typescript-eslint/typescript-estree":
    dependencies:
      typescript: "5.9.3"
  "ts-api-utils":
    dependencies:
      typescript: "5.9.3"
  "prettier-plugin-organize-imports":
    dependencies:
      typescript: "5.9.3"

# Vite also accepts 0.27.x; keep every workspace tool on the patched line.
# https://github.com/advisories/GHSA-g7r4-m6w7-qqqr (fixed in 0.28.1)
overrides:
  esbuild: ^0.28.2
